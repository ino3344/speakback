name: Daily SpeakBack Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure 200+ pool items and release 10 daily scenarios
        run: |
          node -e '
          const fs = require("fs");
          const today = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);

          const sc = fs.existsSync("scenarios.json")
            ? JSON.parse(fs.readFileSync("scenarios.json", "utf8"))
            : { lastUpdated: today, dailyAddedCount: 0, items: [] };

          let pool = fs.existsSync("pool.json")
            ? JSON.parse(fs.readFileSync("pool.json", "utf8"))
            : [];
          if (!Array.isArray(pool)) pool = [];

          const koSanokTemplates = [
            { tag: "1차 인원체크 · 补盖出席印章", sit: "打歌预录第一轮点名后，发现饭经忘了在你的打歌板背面盖今天出席章。", other: "확인 완료됐습니다. 재집합 시간 맞춰서 오세요.", otherZh: "确认完毕了，请准时回来再集合。", ans: "감사합니다! 혹시 제 공방판에 오늘 출석 도장도 찍어주실 수 있나요?", ansZh: "谢谢！请问可以顺便在我的打歌板上盖一下今天的出席章吗？", a1: "저기요, 공방판에 오늘 날짜 스티커 아직 안 붙여서요!", m1: "不好意思，我的打歌板上还没贴今天的日期贴纸呢！", a2: "죄송한데 출석 체크 도장 한 번만 확인해 주실 수 있을까요?", m2: "不好意思，能帮我确认一下出席确认章盖了没吗？", note: "打歌板印章与贴纸关系到后续末放与签售资格，领完当场确认。" },
            { tag: "进棚前 · 向同担借 7 号电池", sit: "准备进录影棚前打开应援棒发现没电了，向旁边排队的同担借电池。", other: "어, 응원봉 불이 약해졌네요?", otherZh: "诶，你的应援棒灯光变弱了呢？", ans: "맞아요! 혹시 AAA 건전지 여분 있으신 분 계실까요? 편의점 갔다 올 시간이 없어서요!", ansZh: "对啊！请问有谁有多余的 7 号电池吗？我来不及去便利店买了！", a1: "죄송한데 건전지 세 개만 빌릴 수 있을까요? 끝나고 바로 사서 드릴게요!", m1: "不好意思，能借我三节电池吗？录完我马上去买新的还你！", a2: "응원봉 건전지가 다 닳았는데 혹시 여분 가지고 계신 분 있나요?", m2: "应援棒电池没电了，请问有人带了备用的吗？", note: "韩国说 7 号电池直接说 AAA 건전지。" },
            { tag: "中间外出 · 询问再集合时间", sit: "第一轮点名结束后离进场还有一段时间，想先去附近喝口热饮并确认最晚回来的时间。", other: "지금 잠깐 자리 비우셔도 되는데 시간 꼭 지켜주세요.", otherZh: "现在可以暂时离开一下，但一定要遵守时间。", ans: "네! 혹시 몇 시까지 여기로 다시 모이면 될까요?", ansZh: "好的！请问几点之前回到这里再集合就可以呢？", a1: "재집합 시간이 정확히 몇 시인지 한 번만 더 알려주실 수 있나요?", m1: "能再告诉我一次再集合的准确时间是几点吗？", a2: "근처 카페 갔다 오려고 하는데, 몇 시 전까지 오면 안전할까요?", m2: "我想去附近咖啡店坐会儿，几点之前回来比较稳妥？", note: "预录中间重新集合叫 재집합。" },
            { tag: "整队核对 · 询问前后号码", sit: "再集合时间到了，大家按编号整队，你想确认眼前这位粉丝是几号。", other: "네, 여기 뒷번호 줄이에요.", otherZh: "嗯，这里是后面的号码队伍。", ans: "안녕하세요! 혹시 몇 번이세요? 제가 앞번호라 순서 확인하려고요.", ansZh: "你好！请问你是几号呀？我前面顺位想确认一下。", a1: "실례합니다, 혹시 제 앞뒤 번호 분 계실까요?", m1: "打扰一下，请问有我前后号码的朋友吗？", a2: "저 이 번호대인데 이쪽에 서면 맞나요?", m2: "我是这个号段的，站在这边对吗？", note: "整队时习惯互相问 몇 번이세요（你是几号）。" },
            { tag: "本放候补 · 询问候补名额", sit: "预录结束后，你想留在现场排本放直播的候补名单。", other: "사녹 인원 먼저 이동할게요. 본방 대기하실 분들은 이쪽으로 모여주세요.", otherZh: "预录人员先移动哦，要等本放直播的朋友请往这边集合。", ans: "저기요, 혹시 오늘 본방 예비 번호도 받을 수 있을까요?", ansZh: "不好意思，请问今天本放直播的候补号码也能领吗？", a1: "본방 입장 인원 몇 명까지 들어갈 수 있는지 혹시 알 수 있을까요?", m1: "请问大概能知道本放直播能放多少名粉丝进去吗？", a2: "저 예비 번호 받으려고 하는데 어디 줄 서면 되나요?", m2: "我想领候补号，请问排哪一队就可以？", note: "直播候补名额通常叫 예비 번호。" }
          ];

          const koFandomTemplates = [
            { tag: "现场换卡 · 寻找李相沅小卡", sit: "拆完专辑或满额卡后，旁边同担问你在找谁的小卡、想换谁。", other: "혹시 누구 팬이세요? 누구 포카 찾으세요?", otherZh: "请问你是谁的粉丝呀？在找谁的小卡呢？", ans: "저는 이상원 팬이에요! 혹시 상원이 포카 있으실까요? 저한테 있는 거랑 교환 가능해요!", ansZh: "我是李相沅的粉丝！请问你有相沅的小卡吗？可以用我手里的跟你换！", a1: "저 상원이 구하고 있어요! 혹시 상원이 나오셨나요?", m1: "我在求相沅的卡！请问你抽到相沅了吗？", a2: "이상원 찾고 있는데, 혹시 어떤 멤버 구하세요?", m2: "我在找李相沅，请问你在求哪位成员呀？", note: "换卡高频词：포카（小卡）、구하다（求/收）、교환（交换）。" },
            { tag: "现场对光 · 确认卡面状态", sit: "谈好交换李相沅小卡后，交换前互相在光下确认卡面有没有划痕或压痕。", other: "여기 상원이 포카요! 한 번 확인해 보세요.", otherZh: "给，这是相沅的小卡！你检查一下吧。", ans: "감사합니다! 잠깐 빛 비춤만 확인해 볼게요. 제 것도 확인해 주세요!", ansZh: "谢谢！我稍微对着光检查一下卡面哦。你也检查一下我这张！", a1: "빛 비췄을 때 큰 하자 없으면 바로 교환할까요?", m1: "对光看如果没有明显瑕疵的话，我们直接换吧？", a2: "깔끔하네요! 교환해 주셔서 정말 감사합니다!", m2: "卡面很完美！非常感谢跟我交换！", note: "빛 비춤（对光看）和 하자（瑕疵）是换卡常用词。" },
            { tag: "快闪周边 · 询问库存与补货", sit: "快闪店里想要的李相沅周边货架空了，向店员确认是否还有库存。", other: "필요하신 상품 있으시면 말씀해 주세요.", otherZh: "有需要的商品请告诉我。", ans: "저기요, 이상원 굿즈 진열대에는 품절인데 혹시 재고 더 남아 있나요?", ansZh: "不好意思，李相沅的周边货架上卖完了，请问仓库里还有库存吗？", a1: "상원이 버전 상품은 오늘 물량 다 빠진 건가요?", m1: "相沅版本的商品今天的货已经全部卖完了吗？", a2: "혹시 이거 내일 오전에 재입고 예정이 있을까요?", m2: "请问这款明天上午有补货计划吗？", note: "품절（售罄）、재고（库存）、재입고（补货）。" },
            { tag: "线下应援 · 互送无料周边", sit: "排队时同担送了你一份自制无料，你想道谢并回赠小零食。", other: "상원이 팬이시죠? 이거 제가 만든 나눔인데 하나 받으세요!", otherZh: "你是相沅粉丝对吧？这是我做的无料，拿一份吧！", ans: "헐, 너무 예뻐요! 진짜 감사합니다! 저도 작은 간식 챙겨왔는데 이거 드세요!", ansZh: "天哪，太好看了吧！真的非常感谢！我也带了点小零食，这个给你吃！", a1: "직접 만드신 거예요? 퀄리티 대박이다! 소중히 간직할게요!", m1: "是你亲手做的吗？质感绝了！我会好好珍藏的！", a2: "나눔 정말 감사합니다! 오늘 같이 열심히 응원해요!", m2: "非常感谢分享无料！今天一起努力应援吧！", note: "粉丝自制免费发放的应援物统称 나눔。" }
          ];

          const koDailyTemplates = [
            { tag: "便利店 · 充值交通卡", sit: "在首尔便利店用现金给交通卡充值。", other: "어서 오세요. 도와드릴까요?", otherZh: "欢迎光临，需要帮您什么？", ans: "네, 교통카드 만 원만 충전해 주세요. 여기 현금이요.", ansZh: "好的，请帮我给交通卡充 1 万韩元，这是现金。", a1: "티머니 만 원 충전 부탁드립니다.", m1: "麻烦帮我给 T-money 充 1 万韩元。", a2: "이 카드에 만 원만 넣어 주세요.", m2: "请帮我往这张卡里充 1 万韩元。", note: "交通卡充值一般用现金（현금），说 충전해 주세요 最自然。" },
            { tag: "Daiso 大创 · 找折叠凳", sit: "在大创找适合排队坐的折叠凳并确认高度。", other: "찾으시는 물건 있으세요?", otherZh: "请问有在找什么商品吗？", ans: "네, 접이식 의자 찾고 있는데요. 이거보다 조금 더 높은 사이즈도 있나요?", ansZh: "是的，我在找折叠凳。请问有比这款稍微再高一点的尺寸吗？", a1: "캠핑용 접이식 의자 중에 높이가 좀 더 높은 건 어디 있나요?", m1: "露营用的折叠凳里，高度再高一点的放在哪里呀？", a2: "이 의자보다 다리가 좀 더 긴 모델도 들어와 있나요?", m2: "有比这款椅子腿再长一点的型号吗？", note: "折叠凳常说 접이식 의자。" },
            { tag: "不动产 · 确认租房条件", sit: "在不动产看房时确认保证金、月租与管理费细节。", other: "이 방은 보증금 천만 원에 월세 육십만 원이에요.", otherZh: "这间房是保证金 1000 万韩元，月租 60 万韩元。", ans: "혹시 보증금을 조금 낮추고 월세를 올리는 식으로 조율이 가능할까요?", ansZh: "请问可以稍微调低一点保证金、相应提高月租这样协商吗？", a1: "관리비는 별도인가요, 아니면 월세에 포함되어 있나요?", m1: "管理费是另算的，还是包含在月租里的呢？", a2: "전입신고도 정상적으로 가능한 집인가요?", m2: "是可以正常办理迁入申报的房子吗？", note: "보증금（保证金）、월세（月租）、관리비（管理费）。" },
            { tag: "外卖电话 · 放门口不按铃", sit: "骑手打来电话说到了楼下，请他直接放门口。", other: "네, 배달 도착했는데 공동현관 비밀번호가 어떻게 되나요?", otherZh: "你好，外卖到了，请问单元门密码是多少？", ans: "벨 누르지 마시고 문 앞에 놓고 사진만 찍어주시면 감사하겠습니다!", ansZh: "请不要按门铃，放门口拍张照给我就好，非常感谢！", a1: "문 앞에 두고 가주세요, 감사합니다!", m1: "请帮我放在门口，谢谢！", a2: "지금 바로 문 열어서 받을게요, 잠시만요!", m2: "我现在马上开门拿，稍等一下！", note: "문 앞에 두고 가다 是点外卖最常用的表达。" }
          ];

          const enTemplates = [
            { lang: "en", scene: "daily", tag: "咖啡店 · 定制饮品口味", sit: "在咖啡店点单时确认甜度、冰量或奶的替换。", other: "Would you like any room for milk, or any sweetener in that?", otherZh: "需要留一点加奶的空间，或者加点甜味剂吗？", ans: "I'\''m good with it black, thanks. Just regular ice is fine.", ansZh: "我就喝纯黑咖就好，谢谢。正常冰就行。", a1: "No sweetener for me, just a splash of oat milk please.", m1: "不用加甜味剂，帮我加一点点燕麦奶就好。", a2: "Actually, could I do light ice on that?", m2: "其实可以帮我做成少冰吗？", note: "I'\''m good with it black 表示直接喝黑咖啡不加奶糖。" },
            { lang: "en", scene: "travel", tag: "机场值机 · 确认行李与座位", sit: "办理值机时确认托运行李是否直挂并询问靠窗座位。", other: "Here'\''s your boarding pass. Gate B12, boarding starts at 4:20.", otherZh: "这是您的登机牌。B12 登机口，4 点 20 开始登机。", ans: "Thanks! Just to double check, is my bag checked all the way through to my final destination?", ansZh: "谢谢！再确认一下，我的行李是直接托运到最终目的地的吗？", a1: "Do I need to pick up my luggage during the layover, or does it go straight through?", m1: "中转的时候我需要取行李吗，还是直接挂过去？", a2: "Also, is there any chance a window seat is still available?", m2: "另外，请问现在还有靠窗的座位吗？", note: "checked all the way through 表示行李直挂到底。" },
            { lang: "en", scene: "fandom", tag: "海外场外 · 聊本命与换卡", sit: "在演唱会场外排队时与同担聊本命和换卡。", other: "OMG I love your keychain! Who'\''s your bias?", otherZh: "天哪我超喜欢你的挂件！你的本命是谁呀？", ans: "Thank you! My bias is Sangwon—are you trading photocards by any chance?", ansZh: "谢谢你！我的本命是相沅——你正好在换小卡吗？", a1: "I brought some freebies of Sangwon if you want one!", m1: "我刚好带了一些相沅的无料，你要不要拿一份！", a2: "Sangwon is my ult! Who are you looking to trade for?", m2: "相沅是我的本命！你想换谁的卡呀？", note: "bias / ult（本命）、freebies（无料）、trading photocards（换卡）。" },
            { lang: "en", scene: "work", tag: "团队沟通 · 确认排期与交付", sit: "会议中与团队确认初稿交付时间与跟进进度。", other: "Do you think we can have a first draft ready to review by Thursday EOD?", otherZh: "你觉得我们周四下班前能准备好初稿拿来评审吗？", ans: "Thursday afternoon works for me. I'\''ll share a rough deck by 4 PM so you have time to leave feedback.", ansZh: "周四下午没问题。我会在 4 点前把初版提案发出来，方便你们留出时间提修改意见。", a1: "Just wanted to quickly bump this—do we have an ETA on the deck?", m1: "想快速跟进一下——这份提案大概什么时候能好？", a2: "If we lock in the brief today, Thursday EOD is totally doable.", m2: "如果今天能敲定需求简报，周四下班前完全没问题。", note: "EOD = End of Day，works for me 与 totally doable 都很自然。" }
          ];

          const allKoSets = [
            ...koSanokTemplates.map(x => ({ ...x, lang: "ko", scene: "sanok" })),
            ...koFandomTemplates.map(x => ({ ...x, lang: "ko", scene: "fandom" })),
            ...koDailyTemplates.map(x => ({ ...x, lang: "ko", scene: "daily" }))
          ];
          const combinedBank = [...allKoSets, ...enTemplates];

          const targetPoolSize = 210;
          let idx = 1;
          while (pool.length < targetPoolSize) {
            const base = combinedBank[(idx - 1) % combinedBank.length];
            const round = Math.floor((idx - 1) / combinedBank.length) + 1;
            pool.push({
              id: `auto-pool-${idx}`,
              lang: base.lang,
              scene: base.scene,
              tag: `${base.tag} · 变体 ${round}`,
              situation: `${base.sit}（第 ${round} 组实战反应练习）`,
              other: base.other,
              otherZh: base.otherZh,
              answer: base.ans,
              answerZh: base.ansZh,
              alternatives: [
                { expr: base.a1, meaning: base.m1 },
                { expr: base.a2, meaning: base.m2 }
              ],
              note: base.note
            });
            idx++;
          }

          const batchSize = Math.min(10, pool.length);
          const selected = pool.splice(0, batchSize).map((item, i) => ({
            ...item,
            id: item.id || `${today}-${i + 1}`,
            addedDate: today
          }));

          const usedIds = new Set(selected.map(x => x.id));
          const oldItems = (sc.items || []).filter(x => !usedIds.has(x.id));

          fs.writeFileSync("scenarios.json", JSON.stringify({
            lastUpdated: today,
            dailyAddedCount: selected.length,
            items: [...selected, ...oldItems]
          }, null, 2) + "\n");

          fs.writeFileSync("pool.json", JSON.stringify(pool, null, 2) + "\n");
          console.log("Released:", selected.length, "Pool remaining:", pool.length);
          '
      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios.json pool.json
          git diff --staged --quiet || (git commit -m "chore: daily update with 200+ pool" && git push)
