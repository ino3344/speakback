name: Daily SpeakBack Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update scenarios from pool
        run: |
          node -e '
          const fs = require("fs");
          const today = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
          const sc = JSON.parse(fs.readFileSync("scenarios.json", "utf8"));
          const pool = JSON.parse(fs.readFileSync("pool.json", "utf8"));
          if (!pool.length) process.exit(0);
          const batch = pool.splice(0, 10).map((item, i) => ({
            ...item,
            id: item.id || `${today}-${i + 1}`,
            addedDate: today
          }));
          const usedIds = new Set(batch.map(x => x.id));
          const restOld = (sc.items || []).filter(x => !usedIds.has(x.id));
          fs.writeFileSync("scenarios.json", JSON.stringify({
            lastUpdated: today,
            dailyAddedCount: batch.length,
            items: [...batch, ...restOld]
          }, null, 2) + "\n");
          fs.writeFileSync("pool.json", JSON.stringify(pool, null, 2) + "\n");
          '
      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios.json pool.json
          git diff --staged --quiet || (git commit -m "chore: daily update" && git push)
